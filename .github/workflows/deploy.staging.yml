name: Deploy Staging

on:
  push:
    branches:
      - uat
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_REPOSITORY }}

jobs:
  build-and-deploy:
    name: Build image and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

      - name: Deploy on VPS (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            IMAGE="${{ env.IMAGE_NAME }}:staging"
            CONTAINER_NAME="backend-staging"
            ENV_FILE="$HOME/env/staging.env"

            mkdir -p "$HOME/env"
            cat > "$ENV_FILE" <<EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            FRONTEND_URLS=${{ secrets.FRONTEND_URLS }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            KYC_CHALLENGE_TTL_MINUTES=${{ secrets.KYC_CHALLENGE_TTL_MINUTES }}
            SOLANA_RPC_URL=${{ secrets.SOLANA_RPC_URL }}
            SOLANA_WSS_URL=${{ secrets.SOLANA_WSS_URL }}
            RPC_ETH=${{ secrets.RPC_ETH }}
            RPC_BNB=${{ secrets.RPC_BNB }}
            RPC_RATE_LIMIT_PER_SECOND=${{ secrets.RPC_RATE_LIMIT_PER_SECOND }}
            ZERION_API_KEY=${{ secrets.ZERION_API_KEY }}
            ETHERSCAN_API_URL=${{ secrets.ETHERSCAN_API_URL }}
            ETHERSCAN_CHAIN_ID=${{ secrets.ETHERSCAN_CHAIN_ID }}
            BNB_CHAIN_ID=${{ secrets.BNB_CHAIN_ID }}
            ARB_CHAIN_ID=${{ secrets.ARB_CHAIN_ID }}
            RPC_TRX=${{ secrets.RPC_TRX }}
            TRONGRID_API_KEY=${{ secrets.TRONGRID_API_KEY }}
            SOLSCAN_API_KEY=${{ secrets.SOLSCAN_API_KEY }}
            ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}
            BSCSCAN_API_KEY=${{ secrets.BSCSCAN_API_KEY }}
            WALLET_SEED=${{ secrets.WALLET_SEED }}
            WALLET_CEO_ETH=${{ secrets.WALLET_CEO_ETH }}
            WALLET_CEO_BNB=${{ secrets.WALLET_CEO_BNB }}
            WALLET_CEO_SOL=${{ secrets.WALLET_CEO_SOL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            TZ=${{ secrets.TZ }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            FRONTEND_URL_GOOGLE_REDIRECT=${{ secrets.FRONTEND_URL_GOOGLE_REDIRECT }}
            APP_NAME=${{ secrets.APP_NAME }}
            APP_DESCRIPTION=${{ secrets.APP_DESCRIPTION }}
            APP_LOGO=${{ secrets.APP_LOGO }}
            COINGECKO_SIMPLE_PRICE_URL=${{ secrets.COINGECKO_SIMPLE_PRICE_URL }}
            EOF

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p 8000:8000 \
              "$IMAGE"
            docker image prune -f
